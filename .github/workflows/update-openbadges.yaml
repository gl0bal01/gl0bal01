name: Update Latest OpenBadges
on:
  push:
    paths:
      - 'my-badges/openbadges/*.png'
      - 'my-badges/openbadges/*.jpg'
      - 'my-badges/openbadges/*.jpeg'
      - 'my-badges/openbadges/*.svg'
  workflow_dispatch:
concurrency:
  group: readme-updates
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update-openbadges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Update OpenBadges in Achievements
        run: |
          python3 << 'EOF'
          import os
          import re
          from pathlib import Path
          
          # Find all badge images
          badge_dir = Path('my-badges/openbadges')
          if not badge_dir.exists():
              print('Error: Badge directory not found')
              exit(1)
          
          # Collect all image files
          badge_files = []
          for ext in ['png', 'jpg', 'jpeg', 'svg']:
              badge_files.extend(badge_dir.glob(f'*.{ext}'))
          
          # Sort numerically by filename
          def numeric_sort_key(path):
              try:
                  return int(path.stem)
              except ValueError:
                  return float('inf')
          
          badge_files = sorted(badge_files, key=numeric_sort_key)
          
          if not badge_files:
              print('No badge images found, skipping update')
              exit(0)
          
          # Generate badge HTML with collapsible section
          badges_html = ' '.join([
              f'<img src="my-badges/openbadges/{badge.name}" alt="OpenBadge" width="64">'
              for badge in badge_files
          ])
          
          badge_html = f'''<details>
          <summary>OpenBadges</summary>
          {badges_html}
          </details>'''
          
          # Read Achievements
          with open('Achievements.md', 'r') as f:
              readme_content = f.read()
          
          # Verify markers exist
          if '<!-- openbadges start -->' not in readme_content:
              print('Error: openbadges start marker not found in Achievements.md')
              exit(1)
          if '<!-- openbadges end -->' not in readme_content:
              print('Error: openbadges end marker not found in Achievements.md')
              exit(1)
          
          # Find marker positions
          marker_start = readme_content.find('<!-- openbadges start -->')
          marker_end = readme_content.find('<!-- openbadges end -->') + len('<!-- openbadges end -->')
          
          # Build new content with blank line after end marker
          new_readme = (
              readme_content[:marker_start] +
              '<!-- openbadges start -->\n' +
              badge_html + '\n' +
              '<!-- openbadges end -->\n\n' +
              readme_content[marker_end:].lstrip('\n')
          )
          
          # Write updated file
          with open('Achievements.md', 'w') as f:
              f.write(new_readme)
          
          print(f'Updated {len(badge_files)} badges in Achievements.md')
          EOF
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Achievements.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update OpenBadges section [skip ci]"
            # Retry logic for push (max 5 attempts)
            max_attempts=5
            attempt=1
            while [ $attempt -le $max_attempts ]; do
              echo "Push attempt $attempt of $max_attempts"
              git pull --rebase origin main
              if git push; then
                echo "Successfully pushed changes"
                break
              else
                if [ $attempt -eq $max_attempts ]; then
                  echo "Failed to push after $max_attempts attempts"
                  exit 1
                fi
                echo "Push failed, retrying..."
                attempt=$((attempt + 1))
                sleep 2
              fi
            done
          fi
