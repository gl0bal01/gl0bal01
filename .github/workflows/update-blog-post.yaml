name: Update Latest Blog Post

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual triggers
  push:
    branches:
      - main

jobs:
  update-blog-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and update latest blog posts
        run: |
          # Fetch RSS
          curl -s "https://gl0bal01.com/blog/rss.xml" > feed.xml

          # Extract posts using grep and sed
          grep -o '<item>.*</item>' feed.xml | head -10 | while IFS= read -r item; do
            TITLE=$(echo "$item" | grep -o '<title>[^<]*</title>' | sed 's/<[^>]*>//g')
            LINK=$(echo "$item" | grep -o '<link>[^<]*</link>' | sed 's/<[^>]*>//g')
            DESC=$(echo "$item" | grep -o '<description>[^<]*</description>' | sed 's/<[^>]*>//g' | sed 's/&[^;]*;//g' | cut -c1-200)

            echo "- **[$TITLE]($LINK)** - $DESC..." >> /tmp/posts.txt
          done

          # Build final content
          {
            echo "## Latest Blog Posts"
            echo ""
            cat /tmp/posts.txt
            echo ""
            echo "[**View More →**](https://gl0bal01.com/blog/)"
          } > /tmp/blog_content.txt

          # Replace content between markers
          awk '
            /<!-- blog-post start -->/ {print; system("cat /tmp/blog_content.txt"); f=1; next}
            /<!-- blog-post end -->/ {f=0}
            !f
          ' README.md > README.tmp && mv README.tmp README.md

          rm -f feed.xml /tmp/posts.txt /tmp/blog_content.txt

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update latest blog post"
            git push
          fi
