name: Update Latest Blog Post

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual triggers
  push:
    branches:
      - main

concurrency:
  group: readme-updates
  cancel-in-progress: false

jobs:
  update-blog-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and update latest blog posts
        run: |
          python3 -c "
          import urllib.request
          import re
          import html

          # Fetch RSS feed
          with urllib.request.urlopen('https://gl0bal01.com/blog/rss.xml') as response:
              rss_content = response.read().decode('utf-8')

          # Extract up to 5 items from RSS feed
          rss_items = re.findall(r'<item>(.*?)</item>', rss_content, re.DOTALL)[:5]

          # Parse each blog post
          blog_posts = []
          for item_xml in rss_items:
              title_match = re.search(r'<title>(.*?)</title>', item_xml)
              link_match = re.search(r'<link>(.*?)</link>', item_xml)
              desc_match = re.search(r'<description>(.*?)</description>', item_xml)

              if title_match and link_match:
                  # Strip CDATA wrappers and clean content
                  post_title = re.sub(r'<!\[CDATA\[(.*?)\]\]>', r'\1', title_match.group(1))
                  post_title = html.unescape(post_title.strip())

                  post_link = link_match.group(1).strip()

                  post_desc = re.sub(r'<!\[CDATA\[(.*?)\]\]>', r'\1', desc_match.group(1) if desc_match else '')
                  post_desc = html.unescape(re.sub(r'<[^>]+>', '', post_desc))[:200].strip()

                  blog_posts.append(f'- **[{post_title}]({post_link})** - {post_desc}...')

          # Build blog section content
          with open('blog_content.txt', 'w') as content_file:
              content_file.write('## Latest Blog Posts\n\n')
              content_file.write('\n'.join(blog_posts))
              content_file.write('\n\n[**View More →**](https://gl0bal01.com/blog/)\n')

          # Update README.md between markers
          with open('README.md', 'r') as readme_file:
              readme_content = readme_file.read()

          marker_start = readme_content.find('<!-- blog-post start -->')
          marker_end = readme_content.find('<!-- blog-post end -->') + len('<!-- blog-post end -->')
          # The replacement re-emits the marker with its own newline, so consume
          # the existing one here. Without this the file grew by one blank line
          # on every run.
          if readme_content[marker_end:marker_end + 1] == '\n':
              marker_end += 1

          with open('blog_content.txt', 'r') as content_file:
              blog_section = content_file.read()

          with open('README.md', 'w') as readme_file:
              readme_file.write(
                  readme_content[:marker_start] +
                  '<!-- blog-post start -->\n' +
                  blog_section +
                  '<!-- blog-post end -->\n' +
                  readme_content[marker_end:]
              )
          "

          rm -f blog_content.txt

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update latest blog post [skip ci]"

            # Retry logic for push (max 5 attempts)
            max_attempts=5
            attempt=1
            while [ $attempt -le $max_attempts ]; do
              echo "Push attempt $attempt of $max_attempts"
              git pull --rebase origin main
              if git push; then
                echo "Successfully pushed changes"
                break
              else
                if [ $attempt -eq $max_attempts ]; then
                  echo "Failed to push after $max_attempts attempts"
                  exit 1
                fi
                echo "Push failed, retrying..."
                attempt=$((attempt + 1))
                sleep 2
              fi
            done
          fi
