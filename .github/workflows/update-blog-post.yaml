name: Update Latest Blog Post

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual triggers
  push:
    branches:
      - main

jobs:
  update-blog-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and update latest blog posts
        run: |
          # Fetch RSS and convert to single line
          curl -s "https://gl0bal01.com/blog/rss.xml" | tr '\n' ' ' > feed.xml

          # Extract first 10 items
          grep -oP '<item>.*?</item>' feed.xml | head -10 | while IFS= read -r item; do
            TITLE=$(echo "$item" | grep -oP '<title>\K[^<]+' || echo "No title")
            LINK=$(echo "$item" | grep -oP '<link>\K[^<]+' || echo "#")
            DESC=$(echo "$item" | grep -oP '<description>\K[^<]+' | sed 's/&[^;]*;//g' | cut -c1-200 || echo "")

            echo "- **[$TITLE]($LINK)** - $DESC..." >> posts.txt
          done

          # Build final content
          {
            echo "## Latest Blog Posts"
            echo ""
            cat posts.txt 2>/dev/null || echo "No posts found"
            echo ""
            echo "[**View More →**](https://gl0bal01.com/blog/)"
          } > blog_content.txt

          # Replace content between markers
          awk '
            /<!-- blog-post start -->/ {print; system("cat blog_content.txt"); f=1; next}
            /<!-- blog-post end -->/ {f=0}
            !f
          ' README.md > README.tmp && mv README.tmp README.md

          rm -f feed.xml posts.txt blog_content.txt

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update latest blog post"
            git push
          fi
