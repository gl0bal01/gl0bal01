name: Update Latest Blog Post

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual triggers
  push:
    branches:
      - main

jobs:
  update-blog-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and update latest blog posts
        run: |
          python3 -c "
          import urllib.request
          import re
          import html

          # Fetch RSS
          with urllib.request.urlopen('https://gl0bal01.com/blog/rss.xml') as r:
              rss = r.read().decode('utf-8')

          # Find all items
          items = re.findall(r'<item>(.*?)</item>', rss, re.DOTALL)[:10]

          posts = []
          for item in items:
              title = re.search(r'<title>(.*?)</title>', item)
              link = re.search(r'<link>(.*?)</link>', item)
              desc = re.search(r'<description>(.*?)</description>', item)

              if title and link:
                  t = html.unescape(title.group(1))
                  l = link.group(1)
                  d = html.unescape(re.sub(r'<[^>]+>', '', desc.group(1) if desc else ''))[:200]
                  posts.append(f'- **[{t}]({l})** - {d}...')

          # Write content
          with open('blog_content.txt', 'w') as f:
              f.write('## Latest Blog Posts\n\n')
              f.write('\n'.join(posts))
              f.write('\n\n[**View More →**](https://gl0bal01.com/blog/)\n')

          # Update README
          with open('README.md', 'r') as f:
              readme = f.read()

          start = readme.find('<!-- blog-post start -->')
          end = readme.find('<!-- blog-post end -->') + len('<!-- blog-post end -->')

          with open('blog_content.txt', 'r') as f:
              new_content = f.read()

          with open('README.md', 'w') as f:
              f.write(readme[:start] + '<!-- blog-post start -->\n' + new_content + '<!-- blog-post end -->\n' + readme[end:])
          "

          rm -f blog_content.txt

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update latest blog post"
            git push
          fi
