name: Update Latest Blog Post

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual triggers
  push:
    branches:
      - main

jobs:
  update-blog-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and update latest blog posts
        run: |
          # Fetch RSS and build content
          CONTENT="## Latest Blog Posts\n\n"

          curl -s "https://gl0bal01.com/blog/rss.xml" | xmllint --format - | grep -A 3 "<item>" | head -40 | while read line; do
            if echo "$line" | grep -q "<title>"; then
              TITLE=$(echo "$line" | sed 's/<[^>]*>//g' | sed 's/^[ \t]*//')
            elif echo "$line" | grep -q "<link>"; then
              LINK=$(echo "$line" | sed 's/<[^>]*>//g' | sed 's/^[ \t]*//')
            elif echo "$line" | grep -q "<description>"; then
              DESC=$(echo "$line" | sed 's/<[^>]*>//g' | sed 's/^[ \t]*//' | cut -c1-200)
              if [ ! -z "$LINK" ]; then
                echo "- **[$TITLE]($LINK)** - $DESC..." >> /tmp/posts.txt
              fi
            fi
          done

          # Build final content
          {
            echo "## Latest Blog Posts"
            echo ""
            head -10 /tmp/posts.txt 2>/dev/null || true
            echo ""
            echo "[**View More →**](https://gl0bal01.com/blog/)"
          } > /tmp/blog_content.txt

          # Replace content between markers
          awk '
            /<!-- blog-post start -->/ {print; system("cat /tmp/blog_content.txt"); f=1; next}
            /<!-- blog-post end -->/ {f=0}
            !f
          ' README.md > README.tmp && mv README.tmp README.md

          rm -f /tmp/posts.txt /tmp/blog_content.txt

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update latest blog post"
            git push
          fi
